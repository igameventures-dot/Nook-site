<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumiTech Master Agent - Fixed</title>
<style>
body{background:#080808;color:#fff;font-family:sans-serif;margin:0}
.top{background:#111;padding:15px;border-bottom:1px solid #222}
.tabs{display:flex;gap:5px;padding:10px;background:#111;overflow-x:auto}
.tab{padding:10px 15px;background:#222;border-radius:20px;border:none;color:#aaa;white-space:nowrap}
.tab.active{background:#2563eb;color:#fff}
.panel{display:none;padding:15px;padding-bottom:120px}.panel.active{display:block}
#chat{height:45vh;overflow-y:auto;background:#0f0f0f;padding:10px;border-radius:10px;border:1px solid #222}
.msg{padding:10px;margin:8px 0;border-radius:10px;max-width:90%;word-wrap:break-word}.user{background:#2563eb;margin-left:auto}.ai{background:#1e1e1e;border:1px solid #333;white-space:pre-wrap}
input,textarea{width:100%;padding:12px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;margin-top:8px;box-sizing:border-box}
button{padding:12px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;margin-top:8px;font-weight:bold;width:100%}
.kb{background:#111;padding:10px;border-radius:8px;margin:8px 0;border:1px solid #222}
#previewImg{width:100%;border-radius:12px;margin-top:10px;background:#222;min-height:300px;object-fit:contain}
</style>
</head>
<body>
<div class="top"><b>🧠 LUMITECH MASTER AGENT V2</b><br><small style="color:#0f0">Fixed - Works for NOOK + Any Name</small><br><small id="count" style="color:#888">0 concepts</small></div>

<div class="tabs">
<button class="tab active" onclick="showTab('chat-p',this)">Chat</button>
<button class="tab" onclick="showTab('train-p',this)">Train Me</button>
<button class="tab" onclick="showTab('builder-p',this)">Image Builder</button>
</div>

<div id="chat-p" class="panel active">
<div id="chat"></div>
<div style="display:flex;gap:5px;position:fixed;bottom:0;left:0;right:0;padding:10px;background:#111"><input id="q" placeholder="Ask me..."><button onclick="ask()" style="width:60px">▶</button></div>
</div>

<div id="train-p" class="panel">
<h3>Train Agent</h3>
<input id="conceptTitle" placeholder="Title e.g Nook Style">
<textarea id="conceptData" placeholder="Rule e.g minimalist book logo, warm brown color, cozy reading vibe"></textarea>
<button onclick="train()">TRAIN +</button>
<div id="kbList"></div>
</div>

<div id="builder-p" class="panel">
<h3>🎨 Real Image Builder - FIXED</h3>
<input id="prompt" placeholder="Type full name e.g nook bookstore logo">
<button onclick="buildImage()">GENERATE REAL IMAGE 🔥</button>
<img id="previewImg" src="" alt="Your image will appear here">
<div id="status" style="color:#0f0;margin-top:10px">Ready</div>
<textarea id="code" style="height:50px;font-size:10px"></textarea>
<button onclick="downloadImage()" style="background:#00c851">DOWNLOAD PNG ⬇️</button>
<button onclick="offlineBuild()" style="background:#ff9800">IF NO INTERNET - BUILD OFFLINE CANVAS</button>
<canvas id="offlineCanvas" width="1024" height="1024" style="display:none"></canvas>
</div>

<script>
let kb = JSON.parse(localStorage.getItem('lumitech_kb')||'[]');
let lastImageUrl="";
function showTab(id,el){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');renderKB()}
function renderKB(){document.getElementById('kbList').innerHTML=kb.map((k,i)=>`<div class=kb><b>${k.title}</b><br><small>${k.data}</small><br><button onclick="kb.splice(${i},1);saveKB()" style="background:#ff3333;padding:5px;width:auto">Delete</button></div>`).join('');document.getElementById('count').textContent=kb.length+' concepts trained';}
function saveKB(){localStorage.setItem('lumitech_kb',JSON.stringify(kb));renderKB()}
function train(){let t=conceptTitle.value.trim(),d=conceptData.value.trim();if(!t||!d) return alert('Fill both');kb.push({title:t,data:d});saveKB();conceptTitle.value='';conceptData.value='';alert('Trained! '+t);}
const chatDiv=document.getElementById('chat');
function add(m,c){chatDiv.innerHTML+=`<div class=msg ${c}>${m}</div>`;chatDiv.scrollTop=chatDiv.scrollHeight}
add('Fixed version ready!\n\nNOOK will now work. Type full: "nook bookstore logo" in Image Builder.\n\nAlso added OFFLINE mode if internet fails.','ai')
function ask(){let q=document.getElementById('q').value;if(!q)return;add(q,'user');document.getElementById('q').value='';setTimeout(()=>add('Go to Image Builder and type: "'+q+' logo". It will generate real image. If you trained me, I will use your training.','ai'),400);}

async function buildImage(){
 let p=document.getElementById('prompt').value.trim();
 if(!p) return alert('Type what to build e.g nook logo');
 if(p.length < 5){ p = p + " professional logo design"; }
 let training = kb.map(k=>k.data).join(', ');
 // Always make prompt long and safe
 let fullPrompt = `${p}, logo design, ${training}, professional brand logo, high quality, vector, clean background, 4k`;
 let encoded = encodeURIComponent(fullPrompt);
 let seed = Math.floor(Math.random()*999999);
 let url = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&model=flux&nologo=true&enhance=true&seed=${seed}`;
 
 document.getElementById('status').innerHTML='Generating "'+p+'" - wait 8 secs... 🔄';
 let img=document.getElementById('previewImg');
 lastImageUrl=url;
 document.getElementById('code').value=url;
 
 img.onerror = ()=>{
   document.getElementById('status').innerHTML='Server busy, trying backup server...';
   let backup = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&seed=${seed+1}`;
   img.src=backup;
   lastImageUrl=backup;
 };
 img.onload = ()=>{ document.getElementById('status').innerHTML='✅ Done! Image for "'+p+'" generated! Click DOWNLOAD'; };
 img.src=url;
}

function offlineBuild(){
 let p=document.getElementById('prompt').value.trim() || 'NOOK';
 let canvas=document.getElementById('offlineCanvas');
 let ctx=canvas.getContext('2d');
 ctx.fillStyle="#fef3c7"; ctx.fillRect(0,0,1024,1024);
 ctx.fillStyle="#92400e"; ctx.font="bold 200px serif"; ctx.textAlign="center";
 ctx.fillText(p.substring(0,4).toUpperCase(),512,450);
 ctx.fillStyle="#444"; ctx.font="50px sans-serif";
 ctx.fillText(p.toUpperCase(),512,600);
 let img=document.getElementById('previewImg');
 img.src=canvas.toDataURL();
 lastImageUrl=img.src;
 document.getElementById('status').innerHTML='✅ Offline logo built! Click DOWNLOAD';
}

async function downloadImage(){
 if(!lastImageUrl) return alert('Generate first');
 if(lastImageUrl.startsWith('data:')){
   let a=document.createElement('a'); a.href=lastImageUrl; a.download='nook-logo-'+Date.now()+'.png'; a.click(); return;
 }
 try{
  let res=await fetch(lastImageUrl);
  let blob=await res.blob();
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='logo-'+Date.now()+'.png'; a.click();
  document.getElementById('status').innerHTML='✅ Saved to Downloads!';
 } catch(e){ window.open(lastImageUrl,'_blank'); }
}
renderKB();
</script>
</body>
</html>
